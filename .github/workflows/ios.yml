name: iOS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate release contract
        run: python3 script/validate_release_contract.py
      - name: Install pinned XcodeGen
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            --output "$RUNNER_TEMP/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate and verify Xcode project
        run: |
          xcodegen generate --spec project.yml
          git diff --exit-code -- OmniPulse.xcodeproj/project.pbxproj
      - name: Build iOS
        run: >-
          xcodebuild
          -project OmniPulse.xcodeproj
          -scheme OmniPulse
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Run iOS unit and deterministic UI tests
        run: >-
          xcodebuild test
          -project OmniPulse.xcodeproj
          -scheme OmniPulse
          -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest'
          CODE_SIGNING_ALLOWED=NO
      - name: Build macOS
        run: >-
          xcodebuild
          -project OmniPulse.xcodeproj
          -scheme OmniPulseMac
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Build watchOS
        run: >-
          xcodebuild
          -project OmniPulse.xcodeproj
          -scheme OmniPulseWatch
          -destination 'generic/platform=watchOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Build and validate AltStore IPA
        run: ./script/build_altstore_ipa.sh
      - name: Validate generated AltStore metadata against IPA
        run: |
          IPA_PATH="$(find dist -maxdepth 1 -type f -name 'OmniPulse-AltStore-v*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          cp source.json "$RUNNER_TEMP/source.json"
          python3 script/update_altstore_source.py "$IPA_PATH" "$RUNNER_TEMP/source.json"
          python3 script/validate_altstore.py "$IPA_PATH" "$RUNNER_TEMP/source.json"

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install PlatformIO
        run: python3 -m pip install --disable-pip-version-check platformio==6.1.18
      - name: Build distributed ESP32 profiles
        working-directory: firmware/esp32-omnipulse
        run: |
          pio run -e esp32dev
          test "$(stat -c%s .pio/build/esp32dev/firmware.bin)" -le 1114112

          for env in esp32cam esp32-s3-devkitc-1 seeed_xiao_esp32s3; do
            pio run -e "$env"
            test -s ".pio/build/$env/firmware.bin"
          done
      - name: Build ESP8266
        working-directory: firmware/esp8266-omnipulse
        run: |
          pio run
          test "$(stat -c%s .pio/build/nodemcuv2/firmware.bin)" -le 887795
      - name: Build pinned ESP32-C5 profile
        working-directory: firmware/esp32-omnipulse
        run: |
          pio run -e esp32-c5-devkitc-1
          test "$(stat -c%s .pio/build/esp32-c5-devkitc-1/firmware.bin)" -le 1504051
