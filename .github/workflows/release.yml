name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Install pinned XcodeGen
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            --output "$RUNNER_TEMP/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Build AltStore IPA
        run: |
          chmod +x script/build_altstore_ipa.sh
          script/build_altstore_ipa.sh

      - name: Validate release tag and metadata
        shell: bash
        run: |
          set -euo pipefail
          IPA_PATH="$(find dist -maxdepth 1 -type f -name 'OmniPulse-AltStore-v*.ipa' -print -quit)"
          test -n "$IPA_PATH"

          VERSION="$(python3 - "$IPA_PATH" <<'PY'
          import plistlib
          import sys
          import zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              info_path = next(
                  name for name in archive.namelist()
                  if name.startswith("Payload/") and name.endswith(".app/Info.plist")
              )
              info = plistlib.loads(archive.read(info_path))
          print(info["CFBundleShortVersionString"])
          PY
          )"

          if [[ "v$VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match OmniPulse version $VERSION" >&2
            exit 1
          fi

          python3 script/update_altstore_source.py "$IPA_PATH" source.json
          python3 script/validate_altstore.py "$IPA_PATH" source.json
          cp source.json "$RUNNER_TEMP/source.json"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$IPA_PATH" --clobber
          else
            gh release create \
              "$GITHUB_REF_NAME" \
              "$IPA_PATH" \
              --title "OmniPulse $APP_VERSION" \
              --generate-notes
          fi

      - name: Propose AltStore source update through protected main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="automation/altstore-${GITHUB_REF_NAME}"

          git fetch origin main
          git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH" || true
          git checkout -B "$BRANCH" origin/main
          cp "$RUNNER_TEMP/source.json" source.json

          if git diff --quiet -- source.json; then
            echo "AltStore source already matches main."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json
          git commit -m "release: publish OmniPulse $APP_VERSION to AltStore source"
          git push --force-with-lease origin "HEAD:refs/heads/$BRANCH"

          if ! gh workflow run ios.yml --ref "$BRANCH"; then
            echo "::warning::Could not dispatch CI automatically. Run the iOS workflow for $BRANCH before merging."
          fi

          PR_URL="$(gh pr list --base main --head "$BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [[ -n "$PR_URL" ]]; then
            echo "Existing release metadata PR: $PR_URL"
            exit 0
          fi

          if PR_URL="$(gh pr create             --base main             --head "$BRANCH"             --title "release: publish OmniPulse $APP_VERSION to AltStore source"             --body "Automated post-release metadata update for $GITHUB_REF_NAME. Merge only after required checks pass.")"; then
            echo "Created release metadata PR: $PR_URL"
          else
            echo "::warning::GitHub Actions could not create the PR automatically."
            echo "::warning::Open https://github.com/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1 and create it manually."
          fi
