  />

  <!-- Measurement orbit and fixed observations. -->
  <circle cx="512" cy="512" r="167" fill="none" stroke="#42D6E8" stroke-width="54"/>
  <circle cx="355" cy="455" r="44" fill="#42D6E8"/>
  <circle cx="669" cy="569" r="44" fill="#42D6E8"/>
  <circle cx="512" cy="512" r="57" fill="#42D6E8"/>

  <!-- Cyan = live observation; amber = anomaly or action point. -->
