name: OmniPulse
options:
  minimumXcodeGenVersion: 2.40.0
  developmentLanguage: es
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
targets:
  OmniPulse:
    type: application
    platform: iOS
    sources:
      - path: OmniPulse
        excludes:
          - Resources/Info.plist
          - Resources/Firmware
          - App/OmniPulseIntents.swift
      - path: OmniPulse/Resources/Firmware
        buildPhase: resources
      - path: Shared
    dependencies:
      - target: OmniPulseWatch
    info:
      path: OmniPulse/Resources/Info.plist
      properties:
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "2"
        NSBluetoothAlwaysUsageDescription: OmniPulse utiliza Bluetooth para detectar dispositivos y sensores cercanos.
        NSBluetoothPeripheralUsageDescription: OmniPulse utiliza Bluetooth para comunicarse con sensores cercanos.
        NSLocationWhenInUseUsageDescription: OmniPulse utiliza tu ubicación únicamente cuando decides asociarla a una detección o leer la red Wi-Fi conectada.
        NSLocalNetworkUsageDescription: OmniPulse se conecta directamente a sensores ESP8266 autorizados para recibir escaneos Wi-Fi.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiburonns.OmniPulse
        PRODUCT_NAME: OmniPulse
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: targeted
        SWIFT_EMIT_LOC_STRINGS: YES
  OmniPulseMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: OmniPulseMac
        excludes:
          - OmniPulseMac.entitlements
      - path: OmniPulse/Models
      - path: OmniPulse/Services/BluetoothScanner.swift
      - path: OmniPulse/Services/LocationService.swift
      - path: OmniPulse/Services/SensorBridge.swift
      - path: OmniPulse/Services/SensorPayloadImporter.swift
      - path: OmniPulse/Services/DetectionExportDocument.swift
      - path: OmniPulse/Services/BLEAdvertisementInterpreter.swift
      - path: OmniPulse/Services/WiFiChannelAnalyzer.swift
      - path: OmniPulse/Services/SurveyReportDocument.swift
      - path: OmniPulse/Services/FirmwareCatalog.swift
      - path: OmniPulse/Resources/Firmware
        buildPhase: resources
      - path: OmniPulse/Resources/es.lproj
        buildPhase: resources
      - path: OmniPulse/Resources/en.lproj
        buildPhase: resources
    info:
      path: OmniPulseMac/Info.plist
      properties:
        CFBundleDisplayName: OmniPulse
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "2"
        LSApplicationCategoryType: public.app-category.utilities
        NSBluetoothAlwaysUsageDescription: OmniPulse utiliza Bluetooth para detectar dispositivos y sensores ESP32 cercanos.
        NSLocationUsageDescription: OmniPulse utiliza la ubicación para asociarla a detecciones cuando activas el modo vehículo.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiburonns.OmniPulse
        PRODUCT_NAME: OmniPulse
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: OmniPulseMac/OmniPulseMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: targeted
        SWIFT_EMIT_LOC_STRINGS: YES
  OmniPulseWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: OmniPulseWatch
      - path: Shared
      - path: OmniPulse/Resources/es.lproj
        buildPhase: resources
      - path: OmniPulse/Resources/en.lproj
        buildPhase: resources
    info:
      path: OmniPulseWatch/Info.plist
      properties:
        CFBundleDisplayName: OmniPulse
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "2"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.tiburonns.OmniPulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiburonns.OmniPulse.watchkitapp
        PRODUCT_NAME: OmniPulse Watch
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: NO
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: targeted
        SWIFT_EMIT_LOC_STRINGS: YES
  OmniPulseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OmniPulseTests
    dependencies:
      - target: OmniPulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiburonns.OmniPulseTests
        GENERATE_INFOPLIST_FILE: YES
  OmniPulseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OmniPulseUITests
    dependencies:
      - target: OmniPulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiburonns.OmniPulseUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OmniPulse:
    build:
      targets:
        OmniPulse: all
        OmniPulseTests: [test]
    test:
      targets:
        - OmniPulseTests
        - OmniPulseUITests
  OmniPulseMac:
    build:
      targets:
        OmniPulseMac: all
    run:
      config: Debug
  OmniPulseWatch:
    build:
      targets:
        OmniPulseWatch: all
    run:
      config: Debug
